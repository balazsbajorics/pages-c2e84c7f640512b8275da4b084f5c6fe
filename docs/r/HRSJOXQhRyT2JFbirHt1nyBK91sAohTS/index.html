<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Napi YNAB riport</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8faf8;
  --ink: #18201c;
  --muted: #66736b;
  --line: #d9e1dc;
  --surface: #ffffff;
  --soft: #edf3ef;
  --good: #277a4d;
  --warn: #9a6a00;
  --bad: #b83c31;
  --blue: #2f6f91;
  --accent: #5b50c6;
  --accent-soft: #efedff;
  --available: #e7f5ec;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 1220px; margin: 0 auto; padding: 20px 16px 52px; }
.lock {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.panel {
  width: min(420px, 100%);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 22px;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: 0; }
h2 { font-size: 18px; margin: 30px 0 12px; }
.sub { color: var(--muted); margin-top: 6px; }
form { display: grid; gap: 12px; margin-top: 18px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  font: inherit;
}
button {
  border: 0;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  padding: 12px 14px;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.error { color: var(--bad); min-height: 20px; }
.hidden { display: none; }
header {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  gap: 18px;
  align-items: center;
  padding-bottom: 16px;
}
.stamp { color: var(--muted); text-align: right; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 8px; }
.month-nav button {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 20px;
}
.month-nav button:disabled { opacity: .35; cursor: default; }
.month-nav select {
  min-width: 172px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 9px 34px 9px 12px;
  font: inherit;
  font-weight: 700;
  text-align: center;
}
.plan-banner {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  border-radius: 10px;
  padding: 14px 16px;
  background: var(--accent-soft);
  border: 1px solid #d8d3ff;
}
.plan-banner strong { color: #4338a8; }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plan-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  border: 1px solid #d8d3ff;
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
}
.plan-amount { color: #4338a8; font-size: 20px; font-weight: 750; white-space: nowrap; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 1px 2px rgba(24, 32, 28, .03);
}
.label { color: var(--muted); font-size: 12px; }
.value { font-size: 22px; font-weight: 650; margin-top: 4px; white-space: nowrap; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 12px; font-weight: 650; background: var(--soft); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fbfcfb; }
.available { font-size: 15px; font-weight: 750; }
.available.good { color: var(--good); }
.available.warn { color: var(--warn); }
.available.bad { color: var(--bad); }
.progress { height: 5px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 7px; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--muted);
  padding: 24px;
  text-align: center;
}
.status {
  display: inline-block;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
  background: var(--soft);
}
.ok, .rendezve, .félretéve { color: var(--good); }
.szoros { color: var(--warn); }
.túlköltve { color: var(--bad); }
.note { color: var(--muted); font-size: 12px; margin-top: 3px; }
.timeline { display: grid; gap: 8px; }
.day { margin-top: 16px; color: var(--muted); font-weight: 650; }
.tx {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) 130px;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
.merchant { font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.refund .amount { color: var(--good); }
.projekt .amount { color: var(--warn); }
.átvezetés .amount { color: var(--blue); }
@media (max-width: 820px) {
  header { grid-template-columns: 1fr; text-align: center; }
  .stamp { text-align: left; margin-top: 8px; }
  .stamp { text-align: center; }
  .cards { grid-template-columns: 1fr 1fr; }
  .plans { grid-template-columns: 1fr; }
  table { display: block; overflow-x: auto; }
  .tx { grid-template-columns: 1fr; gap: 5px; }
  .amount { text-align: left; }
}
</style>
</head>

      <button type="submit">Megnyitás</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </div>
</section>

const money = (value) => {
  const rounded = Math.round(Number(value || 0));
  return new Intl.NumberFormat("hu-HU").format(rounded) + " Ft";
};

const bytes = (base64) => Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));

async function decryptReport(password) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: bytes(encryptedReport.salt),
      iterations: encryptedReport.iterations,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(encryptedReport.nonce) },
    key,
    bytes(encryptedReport.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function addCard(parent, label, value, note) {
  const card = el("div", "card");
  card.append(el("div", "label", label), el("div", "value", value));
  if (note) card.append(el("div", "note", note));
  parent.append(card);
}

function renderPlans(parent, plans) {
  if (!plans || !plans.length) return;
  parent.append(el("h2", null, "Ismert havi tervek"));
  const grid = el("section", "plans");
  plans.forEach((item) => {
    const card = el("div", "plan-card");
    const copy = el("div");
    copy.append(el("div", "merchant", item.name));
    copy.append(el("div", "note", item.status + " · " + item.note));
    card.append(copy, el("div", "plan-amount", money(item.target_huf)));
    grid.append(card);
  });
  parent.append(grid);
}

function renderEnvelopes(parent, envelopes) {
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Zseb</th><th class=\"num\">Kiosztva</th><th class=\"num\">Aktivitás</th><th class=\"num\">Elérhető</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  envelopes.forEach((item) => {
    const row = el("tr");
    const name = el("td");
    name.append(el("div", null, item.name));
    if (item.is_protected) name.append(el("div", "note", "védett céltartalék"));
    const spendable = Math.max(1, Number(item.assigned_huf || 0));
    const progress = el("div", "progress");
    const progressFill = el("span");
    progressFill.style.width = Math.min(100, Math.max(0, Number(item.activity_huf || 0) / spendable * 100)) + "%";
    progress.append(progressFill);
    name.append(progress);
    row.append(name);
    row.append(el("td", "num", money(item.assigned_huf)));
    row.append(el("td", "num", money(item.activity_huf)));
    const availableClass = item.available_huf < -0.5 ? "bad" : item.available_huf <= Math.max(item.assigned_huf * .15, 1) ? "warn" : "good";
    row.append(el("td", "num available " + availableClass, money(item.available_huf)));
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderProjects(parent, projects) {
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Külön projekt</th><th>Keret rögzítve</th><th class=\"num\">Teljes projektkeret</th><th class=\"num\">Havi aktivitás</th><th class=\"num\">Élettartam aktivitás</th><th class=\"num\">Maradék</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  projects.forEach((item) => {
    const row = el("tr");
    row.append(el("td", null, item.name));
    row.append(el("td", null, item.balance_as_of_date));
    row.append(el("td", "num", money(item.opening_available_huf)));
    row.append(el("td", "num", money(item.month_activity_huf)));
    row.append(el("td", "num", money(item.lifetime_activity_huf)));
    row.append(el("td", "num", money(item.remaining_huf)));
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderTrueExpenses(parent, trueExpenses) {
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Valódi éves/ritka kiadás</th><th>Zseb</th><th class=\"num\">Várható összeg</th><th class=\"num\">Havi szükséglet</th><th>Következő dátum</th><th class=\"num\">Zseb elérhető</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  trueExpenses.forEach((item) => {
    const row = el("tr");
    row.append(el("td", null, item.name));
    row.append(el("td", null, item.envelope));
    row.append(el("td", "num", money(item.expected_amount_huf)));
    row.append(el("td", "num", money(item.required_monthly_huf)));
    row.append(el("td", null, item.next_due_date || item.due_status));
    row.append(el("td", "num", money(item.current_envelope_available_huf)));
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderTimeline(parent, timeline) {
  if (!timeline.length) {
    parent.append(el("div", "empty", "Ebben a hónapban még nincs banki aktivitás. A Kiosztva oszlop már a teljes havi tervet mutatja."));
    return;
  }
  const wrapper = el("div", "timeline");
  let currentDate = "";
  timeline.forEach((item) => {
    if (item.date !== currentDate) {
      currentDate = item.date;
      wrapper.append(el("div", "day", currentDate));
    }
    const row = el("div", "tx " + item.type);
    const left = el("div");
    left.append(el("div", "merchant", item.merchant || item.description));
    left.append(el("div", "meta", item.description));
    const middle = el("div", "meta", item.category + " · " + item.type + " · " + item.envelope + " · " + item.account);
    const amountText = money(item.display_huf);
    row.append(left, middle, el("div", "amount", amountText));
    wrapper.append(row);
  });
  parent.append(wrapper);
}

const monthLabel = (monthStart) => new Intl.DateTimeFormat("hu-HU", {
  year: "numeric",
  month: "long"
}).format(new Date(monthStart + "T12:00:00"));

function selectedMonthFromUrl(data) {
  const requested = new URLSearchParams(window.location.search).get("month");
  if (requested) {
    const normalized = requested.length === 7 ? requested + "-01" : requested;
    if ((data.available_months || []).includes(normalized)) return normalized;
  }
  return data.default_month || data.month_start;
}

function updateMonthUrl(monthKey) {
  const params = new URLSearchParams(window.location.search);
  params.set("month", monthKey.slice(0, 7));
  window.history.replaceState(null, "", window.location.pathname + "?" + params.toString() + window.location.hash);
}

function render(data, reportData, monthKey) {
  const root = document.getElementById("report");
  root.textContent = "";
  const header = el("header");
  const titleBlock = el("div");
  titleBlock.append(el("h1", null, data.title));
  titleBlock.append(el("p", "sub", "Zero-based háztartási terv"));
  const monthNav = el("div", "month-nav");
  const previous = el("button", null, "‹");
  previous.type = "button";
  previous.setAttribute("aria-label", "Előző hónap");
  const selector = el("select");
  selector.id = "month-selector";
  selector.setAttribute("aria-label", "Költségvetési hónap");
  const availableMonths = reportData.available_months || [data.month_start];
  availableMonths.forEach((availableMonth) => {
    const option = el("option", null, monthLabel(availableMonth));
    option.value = availableMonth;
    option.selected = availableMonth === monthKey;
    selector.append(option);
  });
  const next = el("button", null, "›");
  next.type = "button";
  next.setAttribute("aria-label", "Következő hónap");
  const monthIndex = availableMonths.indexOf(monthKey);
  previous.disabled = monthIndex <= 0;
  next.disabled = monthIndex >= availableMonths.length - 1;
  const selectMonth = (newMonth) => {
    updateMonthUrl(newMonth);
    const nextData = reportData.months ? reportData.months[newMonth] : reportData;
    render(nextData, reportData, newMonth);
  };
  previous.addEventListener("click", () => selectMonth(availableMonths[monthIndex - 1]));
  next.addEventListener("click", () => selectMonth(availableMonths[monthIndex + 1]));
  selector.addEventListener("change", () => selectMonth(selector.value));
  monthNav.append(previous, selector, next);
  const stamp = el("div", "stamp");
  stamp.append(el("div", "label", "Frissítve"));
  stamp.append(el("div", null, data.generated_at));
  header.append(titleBlock, monthNav, stamp);
  root.append(header);

  const todayMonth = new Date().toISOString().slice(0, 7) + "-01";
  const isFuture = monthKey > todayMonth;
  const banner = el("section", "plan-banner");
  const bannerText = el("div");
  bannerText.append(el("strong", null, isFuture ? "Jövő hónap terve" : "Aktuális havi terv"));
  bannerText.append(el("div", "note", "Minden zsebnél: Kiosztva − Aktivitás = Elérhető."
    + (isFuture ? " Az aktivitás a tranzakciókkal érkezik." : "")));
  banner.append(bannerText, el("div", "available good", money(data.totals.available_huf) + " összesen elérhető"));
  root.append(banner);

  renderPlans(root, data.plans || []);

  const cards = el("section", "cards");
  addCard(cards, "Havi keret", money(data.totals.monthly_funding_huf), "az új havi pénz, cél: 2 M Ft");
  addCard(cards, "Kiosztva", money(data.totals.assigned_huf), "a zsebek teljes kerete költés előtt");
  addCard(cards, "Aktivitás", money(data.totals.operating_activity_huf), "banki költés mínusz refund");
  addCard(cards, "Rugalmasan elérhető", money(data.totals.flexible_available_huf));
  addCard(cards, "Védett céltartalék", money(data.totals.protected_available_huf));
  addCard(cards, "Túlköltés", money(data.totals.overspent_huf));
  addCard(cards, "Külön projektek havi", money(data.totals.project_month_activity_huf));
  addCard(cards, "Napi rugalmas irányérték", money(data.totals.daily_flexible_huf));
  root.append(cards);

  root.append(el("h2", null, "Zsebek"));
  renderEnvelopes(root, data.envelopes);

  root.append(el("h2", null, "Külön finanszírozott projektek"));
  renderProjects(root, data.projects);

  root.append(el("h2", null, "Éves és ritka kiadások"));
  renderTrueExpenses(root, data.true_expenses);

  root.append(el("h2", null, "Havi kiadások időrendben"));
  renderTimeline(root, data.timeline);

  const quality = el("p", "sub",
    "Minőség: review " + (data.data_quality.category_review_transactions || 0)
    + ", árfolyamhiány " + (data.data_quality.transactions_without_huf_rate || 0)
    + ", duplikált tranzakció " + (data.data_quality.duplicate_transaction_ids || 0)
    + ", várandóssági scope review " + (data.data_quality.childbirth_scope_review || 0)
  );
  root.append(quality);
}

function passwordFromUrl() {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1)
    : window.location.hash;
  const hashParams = new URLSearchParams(hashText);
  const queryParams = new URLSearchParams(window.location.search);
  const hashPassword = hashParams.get("pw") || hashParams.get("password");
  const queryPassword = queryParams.get("pw") || queryParams.get("password");

  if (queryPassword && !hashPassword) {
    queryParams.delete("pw");
    queryParams.delete("password");
    const nextSearch = queryParams.toString();
    const nextUrl = window.location.pathname
      + (nextSearch ? "?" + nextSearch : "")
      + "#pw=" + encodeURIComponent(queryPassword);
    window.history.replaceState(null, "", nextUrl);
    return queryPassword;
  }

  return hashPassword || queryPassword || "";
}

async function unlockWithPassword(password) {
  const error = document.getElementById("error");
  error.textContent = "";
  try {
    const data = await decryptReport(password);
    const selectedMonth = selectedMonthFromUrl(data);
    const selectedData = data.months ? data.months[selectedMonth] : data;
    render(selectedData, data, selectedMonth);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("report").classList.remove("hidden");
    return true;
  } catch (err) {
    error.textContent = "Nem sikerült megnyitni. Valószínűleg hibás a jelszó.";
    return false;
  }
}

document.getElementById("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  await unlockWithPassword(document.getElementById("password").value);
});

const initialPassword = passwordFromUrl();
if (initialPassword) {
  document.getElementById("password").value = initialPassword;
  unlockWithPassword(initialPassword);
}
</script>
