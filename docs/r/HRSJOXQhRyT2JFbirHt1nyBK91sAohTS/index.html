<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Napi YNAB riport</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8faf8;
  --ink: #18201c;
  --muted: #66736b;
  --line: #d9e1dc;
  --surface: #ffffff;
  --soft: #edf3ef;
  --good: #277a4d;
  --good-soft: #e3f3e9;
  --good-used: #8fc7a4;
  --warn: #9a6800;
  --warn-soft: #fff2c7;
  --warn-used: #e8bd55;
  --bad: #b83c31;
  --bad-soft: #fbe5e2;
  --bad-used: #dfa49d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 44px; }
.lock {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.panel {
  width: min(420px, 100%);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 22px;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: 0; }
h2 { font-size: 18px; margin: 30px 0 12px; }
.sub { color: var(--muted); margin-top: 6px; }
form { display: grid; gap: 12px; margin-top: 18px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  font: inherit;
}
button {
  border: 0;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  padding: 12px 14px;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.error { color: var(--bad); min-height: 20px; }
.hidden { display: none; }
header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-end;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.stamp { color: var(--muted); text-align: right; }
.cards {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.target-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
}
.label { color: var(--muted); font-size: 12px; }
.value { font-size: 22px; font-weight: 650; margin-top: 4px; white-space: nowrap; }
.unassigned {
  margin-top: 18px;
  padding: 20px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--surface);
}
.unassigned .label { font-size: 13px; }
.unassigned .value { font-size: clamp(30px, 7vw, 44px); }
.alert {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid #e2c36f;
  border-radius: 8px;
  color: #694900;
  background: #fff8df;
}
.category-list {
  display: grid;
  gap: 8px;
}
.category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0 0 12px;
}
.filter-button {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
}
.filter-button[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--ink);
  color: #fff;
}
.category-list-header,
.category-item {
  display: grid;
  grid-template-columns: minmax(220px, 1.35fr) minmax(230px, 1fr) 112px 112px 148px;
  gap: 14px;
  align-items: center;
}
.category-item[hidden] { display: none; }
.category-item.state-yellow { border-color: #dfbd67; background: #fffdf6; }
.category-item.state-red { border-color: #dda49e; }
.category-list-header {
  padding: 0 15px 2px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.category-list-header .num { text-align: right; }
.category-item {
  min-height: 68px;
  padding: 10px 12px 10px 15px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
}
.category-item.wealth-item {
  margin-top: 6px;
  border-width: 2px;
  border-color: #aab7af;
}
.category-name {
  min-width: 0;
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.progress-block { min-width: 0; }
.progress-track {
  display: flex;
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--soft);
  box-shadow: inset 0 0 0 1px rgba(24, 32, 28, .06);
}
.progress-segment { height: 100%; }
.progress-used { background: var(--good-used); }
.progress-available { background: var(--good); }
.progress-covered { background: var(--bad-used); }
.progress-overspent { background: var(--bad); }
.ynab-section-bar { display: flex; gap: 3px; min-width: 0; }
.ynab-section {
  display: flex;
  height: 6px;
  min-width: 4px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--soft);
}
.section-component { height: 100%; }
.section-spent { background: var(--good-used); }
.section-available { background: var(--good); }
.section-remaining { background: #dce2de; }
.section-overspent { background: var(--bad); }
.state-yellow .section-spent { background: #f0d680; }
.state-yellow .section-available { background: #c99900; }
.state-yellow .section-remaining { background: #fff0bd; }
.state-green .section-spent { background: var(--good-used); }
.state-green .section-available { background: var(--good); }
.state-red .section-spent { background: var(--bad-used); }
.state-red .section-overspent { background: var(--bad); }
.target-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 9px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 10px;
}
.target-legend-item { white-space: nowrap; }
.legend-swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 3px;
  border-radius: 2px;
}
.weekly-occurrences {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 6px;
  border-radius: 999px;
  color: var(--muted);
  background: var(--soft);
  font-size: 10px;
}
.target-caption {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.category-metric {
  min-width: 0;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.visually-hidden,
.metric-label {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.metric-value { font-weight: 600; }
.available-pill {
  min-width: 0;
  padding: 7px 11px;
  border-radius: 999px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.available-pill .pill-value {
  display: block;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.25;
  white-space: nowrap;
}
.ledger-label { display: block; font-size: 10px; color: inherit; opacity: .78; }
.available-pill.state-green { color: #175d39; background: var(--good-soft); }
.available-pill.state-red { color: #8f261f; background: var(--bad-soft); }
.available-pill.state-yellow { color: #704b00; background: var(--warn-soft); }
.available-pill.state-neutral { color: var(--muted); background: var(--soft); }
.target-details-cell {
  grid-column: 1 / -1;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
.target-inspector {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 14px 0 10px;
}
.target-donut {
  display: grid;
  width: 76px;
  height: 76px;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--good) var(--target-percent), var(--soft) 0);
}
.target-donut::before {
  content: "";
  grid-area: 1 / 1;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--surface);
}
.target-donut-value { grid-area: 1 / 1; z-index: 1; font-size: 17px; font-weight: 750; }
.target-inspector-title { font-size: 14px; font-weight: 750; }
.target-status-panel {
  margin-top: 7px;
  padding: 8px 10px;
  border-radius: 5px;
  color: #175d39;
  background: var(--good-soft);
  font-size: 12px;
}
.target-status-panel.state-yellow { color: #704b00; background: var(--warn-soft); }
.target-status-panel.state-red { color: #8f261f; background: var(--bad-soft); }
.target-key-metrics { margin-top: 9px; }
.target-key-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.target-key-row:last-child { border-bottom: 0; font-weight: 750; }
.target-details summary {
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 650;
}
.target-detail-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px 14px;
  margin-top: 8px;
}
.target-detail-grid dt { color: var(--muted); font-size: 11px; }
.target-detail-grid dd { margin: 1px 0 0; font-weight: 600; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 12px; font-weight: 650; background: var(--soft); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.wealth-row td { border-top: 2px solid var(--ink); font-weight: 650; }
.amount-positive { color: var(--good); }
.amount-negative { color: var(--bad); }
.amount-zero { color: var(--ink); }
.note { color: var(--muted); font-size: 12px; margin-top: 3px; }
.timeline { display: grid; gap: 8px; }
.day { margin-top: 16px; color: var(--muted); font-weight: 650; }
.tx {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) 130px;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
.merchant { font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.refund .amount { color: var(--good); }
@media (max-width: 940px) {
  header { display: block; }
  .stamp { text-align: left; margin-top: 8px; }
  .cards { grid-template-columns: 1fr 1fr; }
  table { display: block; overflow-x: auto; }
  .category-list-header { display: none; }
  .category-list { gap: 10px; }
  .category-item {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px 12px;
    padding: 13px;
    border-radius: 18px;
  }
  .category-name { grid-column: 1; grid-row: 1; font-size: 16px; }
  .available-pill {
    grid-column: 2;
    grid-row: 1;
    min-width: 126px;
    padding: 8px 12px;
  }
  .progress-block { grid-column: 1 / -1; grid-row: 2; }
  .progress-track { height: 7px; }
  .category-metric {
    grid-row: 3;
    padding-top: 2px;
    text-align: left;
    white-space: normal;
  }
  .category-metric.assigned { grid-column: 1; }
  .category-metric.activity { grid-column: 2; text-align: right; }
  .target-details-cell { grid-row: 4; }
  .target-detail-grid { grid-template-columns: 1fr 1fr; }
  .metric-label {
    position: static;
    width: auto;
    height: auto;
    display: block;
    padding: 0;
    margin: 0;
    overflow: visible;
    clip: auto;
    white-space: normal;
    border: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .metric-value { display: block; margin-top: 1px; font-size: 14px; }
  .tx { grid-template-columns: 1fr; gap: 5px; }
  .amount { text-align: left; }
}
@media (max-width: 520px) {
  main { padding: 18px 10px 36px; }
  h1 { font-size: 24px; }
  .cards { grid-template-columns: 1fr; }
  .target-detail-grid { grid-template-columns: 1fr; }
  .target-inspector { grid-template-columns: 72px minmax(0, 1fr); gap: 10px; }
  .target-donut { width: 64px; height: 64px; }
  .target-donut::before { width: 48px; height: 48px; }
  th, td { padding: 9px 8px; }
  .category-item { grid-template-columns: minmax(0, 1fr) auto; }
  .available-pill { min-width: 112px; }
  .available-pill .pill-value { font-size: 15px; }
}
</style>
</head>

const money = (value) => {
  const rounded = Math.round(Number(value || 0));
  return new Intl.NumberFormat("hu-HU").format(rounded) + " Ft";
};

const bytes = (base64) => Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));

async function decryptReport(password) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: bytes(encryptedReport.salt),
      iterations: encryptedReport.iterations,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(encryptedReport.nonce) },
    key,
    bytes(encryptedReport.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function addCard(parent, label, value, note) {
  const card = el("div", "card");
  card.append(el("div", "label", label), el("div", "value", value));
  if (note) card.append(el("div", "note", note));
  parent.append(card);
}

function amountClass(value) {
  const amount = Number(value || 0);
  if (amount < 0) return "amount-negative";
  if (amount > 0) return "amount-positive";
  return "amount-zero";
}

function renderCategories(parent, categories) {
  const filters = el("div", "category-filters");
  filters.setAttribute("role", "group");
  filters.setAttribute("aria-label", "Kategóriaszűrők");
  const filterOptions = [
    ["all", "Összes"],
    ["underfunded", "Alulfinanszírozott"],
    ["ahead", "Ütemterv felett"],
    ["no-target", "Target nélkül"]
  ];
  filterOptions.forEach(([value, label], index) => {
    const button = el("button", "filter-button", label);
    button.type = "button";
    button.dataset.filter = value;
    button.setAttribute("aria-pressed", index === 0 ? "true" : "false");
    button.addEventListener("click", () => {
      filters.querySelectorAll("button").forEach((item) =>
        item.setAttribute("aria-pressed", item === button ? "true" : "false")
      );
      list.querySelectorAll(".category-item").forEach((row) => {
        row.hidden = value !== "all" && row.dataset.filter !== value;
      });
    });
    filters.append(button);
  });
  parent.append(filters);

  const list = el("div", "category-list");
  list.setAttribute("role", "table");
  list.setAttribute("aria-label", "Kategóriák");
  const header = el("div", "category-list-header");
  header.setAttribute("role", "row");
  [
    ["Kategória", ""],
    ["Keretállapot", ""],
    ["Assigned", "num"],
    ["Activity", "num"],
    ["Available", "num"]
  ].forEach(([label, className]) => {
    const column = el("div", className, label);
    column.setAttribute("role", "columnheader");
    header.append(column);
  });
  list.append(header);

  const metric = (label, value, className) => {
    const node = el("div", "category-metric " + className);
    node.setAttribute("role", "cell");
    node.append(
      el("span", "metric-label", label + ":"),
      el("span", "metric-value", money(value))
    );
    return node;
  };
  const statusLabels = {
    overspent: "Túlköltött",
    underfunded: "Alulfinanszírozott",
    snoozed: "Szundi ebben a hónapban",
    on_track: "Ütemterv szerint",
    ahead: "Ütemterv felett"
  };

  categories.forEach((item, index) => {
    const ledgerProgress = item.progress;
    const target = item.target || null;
    const visualStatus = target ? target.visual_status : ledgerProgress.status;
    const nameId = "category-name-" + index;
    const progressId = "category-progress-" + index;
    const row = el(
      "div",
      "category-item state-" + visualStatus
        + (item.id === "wealth" ? " wealth-item" : "")
    );
    row.dataset.filter = !target ? "no-target"
      : target.status === "underfunded" ? "underfunded"
      : target.status === "ahead" ? "ahead" : "target";
    row.setAttribute("role", "row");
    row.setAttribute("aria-labelledby", nameId);
    const name = el("div", "category-name", item.name);
    name.id = nameId;
    name.setAttribute("role", "rowheader");
    row.append(name);

    const progressBlock = el("div", "progress-block");
    progressBlock.setAttribute("role", "cell");
    const progressTrack = el("div", "progress-track");
    let progressSummary = "Nincs kiosztott vagy elérhető összeg";
    const addSegment = (track, className, percent) => {
      if (Number(percent) <= 0) return;
      const segment = el("span", "progress-segment " + className);
      segment.style.width = Number(percent) + "%";
      track.append(segment);
    };

    let targetVisualization = null;
    if (target) {
      const barData = target.progress_bar;
      const weeklySummary = target.weekly_occurrence_count
        ? " · heti cél: " + target.weekly_occurrence_count + " alkalom × "
          + money(target.configured_amount_huf)
        : "";
      progressSummary = barData.section_count + " progress section: "
        + barData.sections.map((section) => section.label).join(", ") + ". "
        + money(barData.rollover_huf) + " előző target-periódus rollover, "
        + money(barData.assigned_huf) + " target-periódus assignment, "
        + money(barData.spent_huf) + " elköltve, "
        + money(barData.available_huf) + " available, "
        + money(barData.overspent_huf) + " túlköltés. "
        + money(target.target_saved_huf) + " célra félretéve, "
        + money(target.underfunded_huf) + " e havi hiány · "
        + money(target.movable_huf) + " szabadon mozgatható" + weeklySummary;

      targetVisualization = el("div", "target-visualization");
      targetVisualization.setAttribute("role", "img");
      targetVisualization.setAttribute("aria-label", "Target progress");
      targetVisualization.setAttribute("aria-describedby", progressId);
      const sectionBar = el("div", "ynab-section-bar");
      sectionBar.setAttribute("aria-hidden", "true");
      barData.sections.forEach((section) => {
        const sectionNode = el("span", "ynab-section");
        sectionNode.dataset.section = section.key;
        sectionNode.title = section.label;
        sectionNode.style.flexGrow = Math.max(1, Number(section.capacity_huf));
        section.components.forEach((component) =>
          addSegment(sectionNode, "section-" + component.key, component.percent)
        );
        sectionBar.append(sectionNode);
      });
      targetVisualization.append(sectionBar);
      const legend = el("div", "target-legend");
      legend.setAttribute("aria-hidden", "true");
      barData.sections
        .flatMap((section) => section.components)
        .filter((component, index, all) =>
          all.findIndex((candidate) => candidate.key === component.key) === index
        )
        .forEach((component) => {
          const item = el("span", "target-legend-item");
          item.append(
            el("span", "legend-swatch section-" + component.key),
            document.createTextNode(component.label)
          );
          legend.append(item);
        });
      targetVisualization.append(legend);
      if (target.weekly_occurrence_count) {
        const occurrences = el(
          "span",
          "weekly-occurrences",
          target.weekly_occurrence_count + " heti alkalom × " + money(target.configured_amount_huf)
        );
        occurrences.setAttribute("aria-hidden", "true");
        targetVisualization.append(occurrences);
      }
    } else if (ledgerProgress.status === "green") {
      addSegment(progressTrack, "progress-used", ledgerProgress.used_percent);
      addSegment(progressTrack, "progress-available", ledgerProgress.available_percent);
      progressSummary = money(ledgerProgress.used_huf) + " felhasználva · "
        + money(ledgerProgress.available_huf) + " elérhető";
    } else if (ledgerProgress.status === "neutral" && ledgerProgress.used_percent > 0) {
      addSegment(progressTrack, "progress-used", ledgerProgress.used_percent);
      progressSummary = money(ledgerProgress.used_huf) + " teljesen felhasználva";
    } else if (ledgerProgress.status === "red") {
      addSegment(progressTrack, "progress-covered", ledgerProgress.covered_percent);
      addSegment(progressTrack, "progress-overspent", ledgerProgress.overspent_percent);
      progressSummary = money(ledgerProgress.covered_huf) + " fedezett · "
        + money(ledgerProgress.overspent_huf) + " fedezetlen";
    }
    const progressDescription = el("span", null, progressSummary);
    progressDescription.id = progressId;
    progressDescription.className = "visually-hidden";
    if (target) {
      progressBlock.append(targetVisualization, progressDescription);
      const targetCaption = el(
        "div",
        "target-caption",
        (statusLabels[target.status] || target.status) + " · "
          + money(target.underfunded_huf) + " még hozzárendelendő"
      );
      targetCaption.setAttribute("aria-hidden", "true");
      progressBlock.append(targetCaption);
    } else {
      progressTrack.setAttribute("role", "img");
      progressTrack.setAttribute("aria-label", "Keretállapot");
      progressTrack.setAttribute("aria-describedby", progressId);
      progressBlock.append(progressTrack, progressDescription);
    }
    row.append(progressBlock);

    row.append(metric("Assigned", item.assigned_huf, "assigned"));
    row.append(metric("Activity", item.activity_huf, "activity"));
    const available = el("div", "available-pill state-" + visualStatus);
    available.setAttribute("role", "cell");
    available.append(
      el(
        "span",
        target ? "ledger-label" : "visually-hidden",
        target ? "Available · könyvelési egyenleg" : "Available:"
      ),
      el("span", "pill-value", money(item.available_huf))
    );
    row.append(available);

    if (target) {
      const cadenceLabels = { weekly: "Heti", monthly: "Havi", yearly: "Éves", custom: "Egyedi" };
      const behaviorLabels = {
        set_aside_another: "Minden periódusban új összeget félretenni",
        refill_up_to: "Feltölteni a célösszegig",
        have_balance_of: "Adott egyenleg elérése"
      };
      const detailsCell = el("div", "target-details-cell");
      detailsCell.setAttribute("role", "cell");
      const details = el("details", "target-details");
      details.append(el("summary", null, "Target részletei · " + (statusLabels[target.status] || target.status)));
      const inspector = el("div", "target-inspector");
      const donut = el("div", "target-donut");
      donut.style.setProperty("--target-percent", Math.min(100, target.progress_percent) + "%");
      donut.setAttribute("aria-hidden", "true");
      donut.append(el("span", "target-donut-value", Math.round(target.progress_percent) + "%"));
      const inspectorBody = el("div");
      inspectorBody.append(el(
        "div",
        "target-inspector-title",
        cadenceLabels[target.cadence] + " target · " + money(target.configured_amount_huf)
      ));
      inspectorBody.append(el(
        "div",
        "target-status-panel state-" + visualStatus,
        (statusLabels[target.status] || target.status) + ". "
          + (target.underfunded_huf
            ? money(target.underfunded_huf) + " hozzárendelése szükséges ebben a hónapban."
            : "A target az ütemterv szerint halad.")
      ));
      const keyMetrics = el("div", "target-key-metrics");
      const keyRow = (label, value) => {
        const row = el("div", "target-key-row");
        row.append(el("span", null, label), el("strong", null, money(value)));
        keyMetrics.append(row);
      };
      keyRow("E havi hozzárendelendő", target.underfunded_huf);
      keyRow("E havi assignment", target.current_month_assigned_huf);
      keyRow("Hátralévő cél", Math.max(0, target.period_target_huf - target.target_progress_huf));
      inspectorBody.append(keyMetrics);
      inspector.append(donut, inspectorBody);
      details.append(inspector);
      const grid = el("dl", "target-detail-grid");
      const detail = (label, value) => {
        const wrapper = el("div");
        wrapper.append(el("dt", null, label), el("dd", null, value));
        grid.append(wrapper);
      };
      detail("Célösszeg", money(target.configured_amount_huf));
      detail("Gyakoriság", cadenceLabels[target.cadence] || target.cadence);
      detail("Működés", behaviorLabels[target.behavior] || target.behavior);
      detail("Következő esedékesség", target.next_due_date || "Nincs határidő");
      detail("Periódus", target.period_start + (target.period_end ? " – " + target.period_end : ""));
      detail("Periódus progress", money(target.target_progress_huf) + " / " + money(target.period_target_huf));
      detail("E havi elvárás", money(target.monthly_required_huf));
      detail("Előző target-periódus rollover", money(target.target_period_rollover_huf));
      detail("E havi assignment", money(target.current_month_assigned_huf));
      detail("E havi activity", money(target.current_month_activity_huf));
      if (target.weekly_occurrence_count) {
        detail("Heti alkalmak ebben a hónapban", String(target.weekly_occurrence_count));
      }
      detail("Hátralék", money(target.raw_underfunded_huf));
      detail("Célra félretéve", money(target.target_saved_huf));
      detail("Szabadon mozgatható", money(target.movable_huf));
      detail("Snooze", target.is_snoozed ? "Igen" : "Nem");
      details.append(grid);
      detailsCell.append(details);
      row.append(detailsCell);
    }
    list.append(row);
  });
  parent.append(list);
}

function renderBudgetEvents(parent, events) {
  if (!events.length) {
    parent.append(el("p", "sub", "Még nincs rögzített budget esemény."));
    return;
  }
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Dátum</th><th>Kategória</th><th>Típus és megjegyzés</th><th class=\"num\">Összeg</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  events.forEach((item) => {
    const row = el("tr");
    row.append(el("td", null, item.date));
    row.append(el("td", null, item.category));
    const detail = el("td");
    detail.append(el("div", null, item.type));
    if (item.note) detail.append(el("div", "note", item.note));
    row.append(detail);
    row.append(el("td", "num", money(item.amount_huf)));
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderTimeline(parent, timeline) {
  const wrapper = el("div", "timeline");
  let currentDate = "";
  timeline.forEach((item) => {
    if (item.date !== currentDate) {
      currentDate = item.date;
      wrapper.append(el("div", "day", currentDate));
    }
    const row = el("div", "tx " + item.type);
    const left = el("div");
    left.append(el("div", "merchant", item.merchant || item.description));
    left.append(el("div", "meta", item.description));
    const middle = el("div", "meta", item.category + " · " + item.type + " · " + item.account);
    row.append(left, middle, el("div", "amount", money(item.display_huf)));
    wrapper.append(row);
  });
  parent.append(wrapper);
}

function render(data) {
  const root = document.getElementById("report");
  root.textContent = "";
  const header = el("header");
  const titleBlock = el("div");
  titleBlock.append(el("h1", null, data.title));
  titleBlock.append(el("p", "sub", "Origó: " + data.reset_date + " · állapot: " + data.as_of_date));
  const stamp = el("div", "stamp");
  stamp.append(el("div", "label", "Frissítve"));
  stamp.append(el("div", null, data.generated_at));
  header.append(titleBlock, stamp);
  root.append(header);

  const unassigned = el("section", "unassigned " + amountClass(data.totals.unassigned_huf));
  unassigned.append(el("div", "label", "Unassigned"));
  unassigned.append(el("div", "value", money(data.totals.unassigned_huf)));
  unassigned.append(el("div", "note", "Pozitív: kiosztásra vár · negatív: túl sok pénz kapott feladatot"));
  root.append(unassigned);

  if (!data.calibration.opening_balances_loaded) {
    root.append(el("div", "alert", "Kalibráció szükséges: a 2026-08-01-i induló számlaegyenlegek még nincsenek betöltve, ezért a cash és Unassigned értékek még nem véglegesek."));
  }

  const cards = el("section", "cards");
  addCard(cards, "Induló cash", money(data.totals.opening_cash_huf));
  addCard(cards, "Nettó költés az origó óta", money(data.totals.net_spending_since_reset_huf));
  addCard(cards, "Aktuális budget cash", money(data.totals.current_budget_cash_huf));
  addCard(cards, "Unassigned", money(data.totals.unassigned_huf));
  addCard(cards, "Vagyon", money(data.totals.wealth_available_huf));
  root.append(cards);

  const targetCards = el("section", "cards target-cards");
  targetCards.setAttribute("aria-label", "Target összesítés");
  addCard(targetCards, "E havi targetek", money(data.totals.monthly_target_requirement_huf));
  addCard(targetCards, "Még hozzárendelendő", money(data.totals.target_underfunded_huf));
  addCard(targetCards, "Célra félretéve", money(data.totals.target_saved_huf));
  addCard(targetCards, "Szabadon átcsoportosítható", money(data.totals.target_movable_huf));
  root.append(targetCards);

  root.append(el("h2", null, "Kategóriák"));
  renderCategories(root, data.categories);

  root.append(el("h2", null, "Budget események"));
  renderBudgetEvents(root, data.budget_events);

  root.append(el("h2", null, "Költések az origó óta"));
  renderTimeline(root, data.timeline);

  const quality = el("p", "sub",
    "Minőség: review " + (data.data_quality.category_review_transactions || 0)
    + ", árfolyamhiány " + (data.data_quality.transactions_without_huf_rate || 0)
    + ", duplikált tranzakció " + (data.data_quality.duplicate_transaction_ids || 0)
  );
  root.append(quality);
}

function passwordFromUrl() {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1)
    : window.location.hash;
  const hashParams = new URLSearchParams(hashText);
  const queryParams = new URLSearchParams(window.location.search);
  const hashPassword = hashParams.get("pw") || hashParams.get("password");
  const queryPassword = queryParams.get("pw") || queryParams.get("password");

  if (queryPassword && !hashPassword) {
    queryParams.delete("pw");
    queryParams.delete("password");
    const nextSearch = queryParams.toString();
    const nextUrl = window.location.pathname
      + (nextSearch ? "?" + nextSearch : "")
      + "#pw=" + encodeURIComponent(queryPassword);
    window.history.replaceState(null, "", nextUrl);
    return queryPassword;
  }

  return hashPassword || queryPassword || "";
}

async function unlockWithPassword(password) {
  const error = document.getElementById("error");
  error.textContent = "";
  try {
    const data = await decryptReport(password);
    render(data);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("report").classList.remove("hidden");
    return true;
  } catch (err) {
    error.textContent = "Nem sikerült megnyitni. Valószínűleg hibás a jelszó.";
    return false;
  }
}

document.getElementById("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  await unlockWithPassword(document.getElementById("password").value);
});

const initialPassword = passwordFromUrl();
if (initialPassword) {
  document.getElementById("password").value = initialPassword;
  unlockWithPassword(initialPassword);
}
</script>
