<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Napi YNAB riport</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8faf8;
  --ink: #18201c;
  --muted: #66736b;
  --line: #d9e1dc;
  --surface: #ffffff;
  --soft: #edf3ef;
  --good: #277a4d;
  --good-soft: #e3f3e9;
  --good-used: #8fc7a4;
  --warn: #9a6800;
  --warn-soft: #fff2c7;
  --warn-used: #e8bd55;
  --bad: #b83c31;
  --bad-soft: #fbe5e2;
  --bad-used: #dfa49d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 44px; }
.lock {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.panel {
  width: min(420px, 100%);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 22px;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: 0; }
h2 { font-size: 18px; margin: 30px 0 12px; }
.sub { color: var(--muted); margin-top: 6px; }
form { display: grid; gap: 12px; margin-top: 18px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  font: inherit;
}
button {
  border: 0;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  padding: 12px 14px;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.error { color: var(--bad); min-height: 20px; }
.hidden { display: none; }
header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: flex-end;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.plan-header {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}
.month-nav-button, .month-button, .today-button, .month-option {
  min-height: 40px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  padding: 9px 12px;
}
.month-nav-button { width: 42px; padding: 8px; font-size: 20px; line-height: 1; }
.month-nav-button:disabled { opacity: .35; cursor: default; }
.month-button { min-width: 190px; font-size: 17px; }
.today-button { position: absolute; right: 0; }
.month-menu {
  position: absolute;
  z-index: 10;
  top: 46px;
  left: 50%;
  width: min(300px, calc(100vw - 32px));
  padding: 6px;
  transform: translateX(-50%);
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 12px 30px rgba(24,32,28,.16);
}
.month-option { width: 100%; text-align: left; border: 0; }
.month-option[aria-current="date"] { background: var(--soft); }
.ready-to-assign { margin-top: 18px; }
.ready-to-assign summary { list-style: none; cursor: pointer; }
.ready-to-assign summary::-webkit-details-marker { display: none; }
.ready-to-assign.state-positive { border-color: var(--good); background: var(--good-soft); }
.ready-to-assign.state-negative { border-color: var(--bad); background: var(--bad-soft); }
.cash-overspending {
  margin-top: 18px;
  padding: 20px;
  border: 3px solid var(--bad);
  border-radius: 10px;
  color: #8f261f;
  background: var(--bad-soft);
}
.cash-overspending summary { list-style: none; cursor: pointer; }
.cash-overspending summary::-webkit-details-marker { display: none; }
.cash-overspending .label { color: inherit; font-size: 14px; font-weight: 700; }
.cash-overspending .value { font-size: clamp(28px, 6vw, 44px); }
.overspending-categories {
  margin: 14px 0 0;
  padding: 14px 0 0;
  border-top: 1px solid currentColor;
  list-style: none;
}
.overspending-category {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 0;
}
.overspending-category .amount { font-weight: 700; white-space: nowrap; }
.ready-breakdown {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid currentColor;
}
.ready-breakdown .value { font-size: 16px; }
.stamp { color: var(--muted); text-align: right; }
.cards {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}
.summary-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.summary-cards .value { font-size: clamp(17px, 2vw, 22px); }
.target-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
}
.label { color: var(--muted); font-size: 12px; }
.value { font-size: 22px; font-weight: 650; margin-top: 4px; white-space: nowrap; }
.income-panel {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.income-panel summary {
  padding: 14px;
  list-style: none;
  cursor: pointer;
}
.income-panel summary::-webkit-details-marker { display: none; }
.income-panel[open] summary { border-bottom: 1px solid var(--line); }
.income-summary-row, .income-row-head {
  display: flex;
  min-width: 0;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
}
.income-summary-row .value { margin-top: 0; }
.income-body { padding: 14px; }
.income-body h3 { margin: 0 0 8px; font-size: 14px; }
.income-body h3:not(:first-child) { margin-top: 16px; }
.income-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.income-metrics .value { font-size: clamp(16px, 2vw, 20px); }
.income-groups, .income-transactions { display: grid; gap: 8px; }
.income-row {
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg);
}
.income-row-title { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.income-row-amount { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }
.income-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 10px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.income-original { margin-top: 4px; font-size: 12px; font-weight: 650; }
.income-empty { color: var(--muted); }
.income-review { color: var(--warn); font-weight: 650; }
.unassigned {
  margin-top: 18px;
  padding: 20px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--surface);
}
.unassigned .label { font-size: 13px; }
.unassigned .value { font-size: clamp(30px, 7vw, 44px); }
.alert {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid #e2c36f;
  border-radius: 8px;
  color: #694900;
  background: #fff8df;
}
.category-list {
  display: grid;
  gap: 8px;
}
.category-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0 0 12px;
}
.filter-button {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
}
.filter-button[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--ink);
  color: #fff;
}
.category-list-header,
.category-item {
  display: grid;
  grid-template-columns: minmax(220px, 1.35fr) minmax(230px, 1fr) 112px 112px 148px;
  gap: 14px;
  align-items: center;
}
.category-item[hidden] { display: none; }
.category-item.state-yellow { border-color: #dfbd67; background: #fffdf6; }
.category-item.state-red { border-color: #dda49e; }
.category-list-header {
  padding: 0 15px 2px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.category-list-header .num { text-align: right; }
.category-item {
  min-height: 68px;
  padding: 10px 12px 10px 15px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  cursor: pointer;
}
.category-item.is-expanded { box-shadow: 0 8px 24px rgba(24, 32, 28, .08); }
.category-item.wealth-item {
  margin-top: 6px;
  border-width: 2px;
  border-color: #aab7af;
}
.category-heading {
  display: flex;
  min-width: 0;
  gap: 8px;
  align-items: center;
}
.category-name {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.category-toggle {
  display: grid;
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  padding: 0;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
}
.category-toggle:focus-visible {
  outline: 3px solid #4b8f71;
  outline-offset: 2px;
}
.category-chevron {
  display: block;
  font-size: 17px;
  line-height: 1;
  transition: transform .16s ease;
}
.category-toggle[aria-expanded="true"] .category-chevron { transform: rotate(90deg); }
.progress-block { min-width: 0; }
.progress-track {
  display: flex;
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--soft);
  box-shadow: inset 0 0 0 1px rgba(24, 32, 28, .06);
}
.progress-segment { height: 100%; }
.progress-used { background: var(--good-used); }
.progress-available { background: var(--good); }
.progress-covered { background: var(--bad-used); }
.progress-overspent { background: var(--bad); }
.ynab-section-bar { display: flex; gap: 3px; min-width: 0; }
.ynab-section {
  display: flex;
  height: 6px;
  min-width: 4px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--soft);
}
.section-component { height: 100%; }
.section-spent { background: var(--good-used); }
.section-available { background: var(--good); }
.section-remaining { background: #dce2de; }
.section-overspent { background: var(--bad); }
.state-yellow .section-spent { background: #f0d680; }
.state-yellow .section-available { background: #c99900; }
.state-yellow .section-remaining { background: #fff0bd; }
.state-green .section-spent { background: var(--good-used); }
.state-green .section-available { background: var(--good); }
.state-red .section-spent { background: var(--bad-used); }
.state-red .section-overspent { background: var(--bad); }
.target-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 9px;
  margin-top: 6px;
  color: var(--muted);
  font-size: 10px;
}
.target-legend-item { white-space: nowrap; }
.legend-swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 3px;
  border-radius: 2px;
}
.weekly-occurrences {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 6px;
  border-radius: 999px;
  color: var(--muted);
  background: var(--soft);
  font-size: 10px;
}
.target-caption {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}
.category-metric {
  min-width: 0;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.visually-hidden,
.metric-label {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.metric-value { font-weight: 600; }
.available-pill {
  min-width: 0;
  padding: 7px 11px;
  border-radius: 999px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.available-pill .pill-value {
  display: block;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.25;
  white-space: nowrap;
}
.ledger-label { display: block; font-size: 10px; color: inherit; opacity: .78; }
.available-pill.state-green { color: #175d39; background: var(--good-soft); }
.available-pill.state-red { color: #8f261f; background: var(--bad-soft); }
.available-pill.state-yellow { color: #704b00; background: var(--warn-soft); }
.available-pill.state-neutral { color: var(--muted); background: var(--soft); }
.category-audit-panel {
  grid-column: 1 / -1;
  min-width: 0;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  cursor: default;
}
.category-audit-panel[hidden] { display: none; }
.category-audit-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.category-audit-section {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, .6);
}
.category-audit-heading {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 10px;
  align-items: baseline;
  margin-bottom: 9px;
}
.category-audit-heading h4 { margin: 0; font-size: 14px; }
.category-audit-summary { color: var(--muted); font-size: 12px; text-align: right; }
.audit-ledger-total,
.audit-reconciliation-note { display: block; margin-top: 2px; }
.audit-ledger-total { color: var(--ink); font-weight: 650; }
.audit-reconciliation-note { max-width: 420px; font-size: 11px; }
.category-audit-list { display: grid; gap: 7px; }
.audit-entry {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
}
.audit-entry-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}
.audit-entry-title { min-width: 0; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.audit-entry-amount { flex: 0 0 auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
.audit-entry-meta, .audit-entry-description {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.category-audit-empty { margin: 0; color: var(--muted); font-size: 12px; }
.target-details-cell {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.target-inspector {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 14px 0 10px;
}
.target-donut {
  display: grid;
  width: 76px;
  height: 76px;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--good) var(--target-percent), var(--soft) 0);
}
.target-donut::before {
  content: "";
  grid-area: 1 / 1;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--surface);
}
.target-donut-value { grid-area: 1 / 1; z-index: 1; font-size: 17px; font-weight: 750; }
.target-inspector-title { font-size: 14px; font-weight: 750; }
.target-status-panel {
  margin-top: 7px;
  padding: 8px 10px;
  border-radius: 5px;
  color: #175d39;
  background: var(--good-soft);
  font-size: 12px;
}
.target-status-panel.state-yellow { color: #704b00; background: var(--warn-soft); }
.target-status-panel.state-red { color: #8f261f; background: var(--bad-soft); }
.target-key-metrics { margin-top: 9px; }
.target-key-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.target-key-row:last-child { border-bottom: 0; font-weight: 750; }
.target-details summary {
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  font-weight: 650;
}
.target-detail-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px 14px;
  margin-top: 8px;
}
.target-detail-grid dt { color: var(--muted); font-size: 11px; }
.target-detail-grid dd { margin: 1px 0 0; font-weight: 600; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 12px; font-weight: 650; background: var(--soft); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.wealth-row td { border-top: 2px solid var(--ink); font-weight: 650; }
.amount-positive { color: var(--good); }
.amount-negative { color: var(--bad); }
.amount-zero { color: var(--ink); }
.note { color: var(--muted); font-size: 12px; margin-top: 3px; }
.timeline { display: grid; gap: 8px; }
.day { margin-top: 16px; color: var(--muted); font-weight: 650; }
.tx {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) 130px;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
.merchant { font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.refund .amount { color: var(--good); }
@media (max-width: 940px) {
  header { display: block; }
  .stamp { text-align: left; margin-top: 8px; }
  .summary-cards, .target-cards { grid-template-columns: 1fr 1fr; }
  table { display: block; overflow-x: auto; }
  .category-list-header { display: none; }
  .category-list { gap: 10px; }
  .category-item {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px 12px;
    padding: 13px;
    border-radius: 18px;
  }
  .category-heading { grid-column: 1; grid-row: 1; }
  .category-name { font-size: 16px; }
  .available-pill {
    grid-column: 2;
    grid-row: 1;
    min-width: 126px;
    padding: 8px 12px;
  }
  .progress-block { grid-column: 1 / -1; grid-row: 2; }
  .progress-track { height: 7px; }
  .category-metric {
    grid-row: 3;
    padding-top: 2px;
    text-align: left;
    white-space: normal;
  }
  .category-metric.assigned { grid-column: 1; }
  .category-metric.activity { grid-column: 2; text-align: right; }
  .category-audit-panel { grid-row: 4; }
  .category-audit-grid { grid-template-columns: 1fr; }
  .target-detail-grid { grid-template-columns: 1fr 1fr; }
  .metric-label {
    position: static;
    width: auto;
    height: auto;
    display: block;
    padding: 0;
    margin: 0;
    overflow: visible;
    clip: auto;
    white-space: normal;
    border: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .metric-value { display: block; margin-top: 1px; font-size: 14px; }
  .tx { grid-template-columns: 1fr; gap: 5px; }
  .amount { text-align: left; }
  .ready-breakdown { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  main { padding: 18px 10px 36px; }
  h1 { font-size: 24px; }
  .target-cards { grid-template-columns: 1fr; }
  .summary-cards { grid-template-columns: 1fr 1fr; }
  .target-detail-grid { grid-template-columns: 1fr; }
  .target-inspector { grid-template-columns: 72px minmax(0, 1fr); gap: 10px; }
  .target-donut { width: 64px; height: 64px; }
  .target-donut::before { width: 48px; height: 48px; }
  th, td { padding: 9px 8px; }
  .category-item { grid-template-columns: minmax(0, 1fr) auto; }
  .available-pill { min-width: 112px; }
  .available-pill .pill-value { font-size: 15px; }
  .plan-header { justify-content: space-between; }
  .month-button { min-width: 0; flex: 1; }
  .today-button { position: static; }
  .ready-breakdown { grid-template-columns: 1fr; }
  .income-row-head { align-items: flex-start; }
  .income-metrics { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<section id="lock" class="lock">
  <div class="panel">
    <h1>Napi YNAB riport</h1>
    <p class="sub">Titkosított GitHub Pages riport. A tartalom csak a jelszóval nyílik meg ezen az eszközön.</p>
    <form id="unlock">
      <input id="password" type="password" autocomplete="current-password" placeholder="Jelszó" autofocus>
      <button type="submit">Megnyitás</button>
      <div id="error" class="error" role="alert"></div>
    </form>
  </div>
</section>

const money = (value) => {
  const amount = Number(value || 0);
  const hasFraction = Math.abs(amount - Math.round(amount)) > 0.0001;
  return new Intl.NumberFormat("hu-HU", {
    minimumFractionDigits: hasFraction ? 2 : 0,
    maximumFractionDigits: 2
  }).format(amount) + " Ft";
};

const bytes = (base64) => Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));

async function decryptReport(password) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: bytes(encryptedReport.salt),
      iterations: encryptedReport.iterations,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(encryptedReport.nonce) },
    key,
    bytes(encryptedReport.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function addCard(parent, label, value, note) {
  const card = el("div", "card");
  card.append(el("div", "label", label), el("div", "value", value));
  if (note) card.append(el("div", "note", note));
  parent.append(card);
}

function amountClass(value) {
  const amount = Number(value || 0);
  if (amount < 0) return "amount-negative";
  if (amount > 0) return "amount-positive";
  return "amount-zero";
}

function originalMoney(value, currency) {
  return new Intl.NumberFormat("hu-HU", { maximumFractionDigits: 4 })
    .format(Number(value || 0)) + " " + (currency || "");
}

function incomeTaxStatus(value) {
  if (value === "net_after_withholding") return "Nettó, már leadózott";
  return "Adóstátusz ellenőrizendő";
}

function incomeBudgetTreatment(value) {
  if (value === "inflow_ready_to_assign") return "Ready to Assign inflow";
  return value || "Budgetkezelés ellenőrizendő";
}

function incomeFactValues(values, fallback) {
  const candidates = Array.isArray(values) ? values : (fallback === undefined ? [] : [fallback]);
  return candidates.filter(
    (value, index) => candidates.findIndex((candidate) => candidate === value) === index
  );
}

function incomeFactText(values, fallback, formatter, emptyLabel) {
  const facts = incomeFactValues(values, fallback);
  return facts.length ? facts.map(formatter).join(" · ") : emptyLabel;
}

function renderIncome(parent, income) {
  const data = income || {
    total_huf: 0,
    total_income_huf: 0,
    monthly_net_spending_huf: 0,
    net_income_huf: 0,
    groups: [],
    transactions: []
  };
  const totalIncome = data.total_income_huf ?? data.total_huf ?? 0;
  const details = el("details", "income-panel");
  const summary = el("summary");
  const summaryRow = el("div", "income-summary-row");
  summaryRow.append(
    el("div", "label", "Havi jövedelem"),
    el("div", "value", money(totalIncome))
  );
  summary.append(summaryRow, el("div", "note", "Részletek megnyitása"));
  details.append(summary);
  const body = el("div", "income-body");
  const metrics = el("div", "income-metrics");
  addCard(metrics, "Összes havi jövedelem", money(totalIncome));
  addCard(metrics, "Havi nettó költés", money(data.monthly_net_spending_huf));
  addCard(metrics, "Havi pénzügyi eredmény", money(data.net_income_huf));
  body.append(metrics);
  if (!(data.transactions || []).length) {
    body.append(el("p", "income-empty", "Ebben a hónapban nincs ismert jövedelem."));
    details.append(body);
    parent.append(details);
    return;
  }

  body.append(el("h3", null, "Payee szerinti bontás"));
  const groups = el("div", "income-groups");
  (data.groups || []).forEach((group) => {
    const row = el("div", "income-row income-group");
    const head = el("div", "income-row-head");
    head.append(
      el("div", "income-row-title", group.payee),
      el("div", "income-row-amount", money(group.amount_huf))
    );
    const facts = el("div", "income-facts");
    const sources = incomeFactText(
      group.income_sources,
      group.income_source,
      (value) => value || "Forrás ellenőrizendő",
      "Forrás ellenőrizendő"
    );
    const types = incomeFactText(
      group.income_types,
      group.income_type,
      (value) => value || "Típus ellenőrizendő",
      "Típus ellenőrizendő"
    );
    facts.append(
      el("span", null, sources + " · " + types),
      el("span", null, incomeFactText(
        group.tax_statuses,
        group.tax_status,
        incomeTaxStatus,
        "Adóstátusz ellenőrizendő"
      )),
      el("span", null, incomeFactText(
        group.budget_treatments,
        group.budget_treatment,
        incomeBudgetTreatment,
        "Budgetkezelés ellenőrizendő"
      )),
      el("span", null, Number(group.transaction_count || 0) + " tétel")
    );
    if (group.needs_review) facts.append(el("span", "income-review", "Ellenőrizendő"));
    row.append(head, facts);
    groups.append(row);
  });
  body.append(groups, el("h3", null, "Jövedelemtételek"));
  const items = el("div", "income-transactions");
  data.transactions.forEach((item) => {
    const row = el("div", "income-row income-transaction");
    const head = el("div", "income-row-head");
    head.append(
      el("div", "income-row-title", item.payee),
      el("div", "income-row-amount", money(item.amount_huf))
    );
    const facts = el("div", "income-facts");
    facts.append(
      el("span", null, item.date),
      el("span", null, item.income_source),
      el("span", null, item.income_type),
      el("span", null, incomeTaxStatus(item.tax_status)),
      el("span", null, incomeBudgetTreatment(item.budget_treatment)),
      el("span", null, item.account)
    );
    if (item.needs_review) facts.append(el("span", "income-review", "Ellenőrizendő"));
    row.append(
      head,
      facts,
      el("div", "income-original", originalMoney(item.amount, item.currency))
    );
    items.append(row);
  });
  body.append(items);
  details.append(body);
  parent.append(details);
}

function activityReconciliation(transactions, activityHuf) {
  const listedTotal = transactions.reduce(
    (total, transaction) => total + Number(transaction.display_huf || 0),
    0
  );
  const difference = Number(activityHuf) - listedTotal;
  const roundingTolerance = Math.floor(transactions.length / 2);
  return {
    listedTotal,
    difference,
    roundingTolerance,
    isWithinRoundingTolerance: Math.abs(difference) <= roundingTolerance
  };
}

function activityReconciliationNotice(reconciliation) {
  if (reconciliation.isWithinRoundingTolerance) {
    return {
      className: "audit-rounding-note",
      text: "Az eltérés a tételsorok egyenkénti egész forintra kerekítéséből adódik."
    };
  }
  return {
    className: "audit-reconciliation-alert",
    text: "Az eltérés meghaladja a szokásos tételsori kerekítést; auditáld a besorolást."
  };
}

function renderCategories(parent, categories, timeline, budgetEvents) {
  let openRow = null;
  const setCategoryExpanded = (row, expanded) => {
    const toggle = row.querySelector(".category-toggle");
    const panel = row.querySelector(".category-audit-panel");

      detail("Szabadon mozgatható", money(target.movable_huf));

    row.append(auditPanel);

    });
    row.addEventListener("click", (event) => {
      if (event.target.closest(".category-audit-panel")) return;

  });
  parent.append(list);

function renderBudgetEvents(parent, events) {
  if (!events.length) {
    parent.append(el("p", "sub", "Még nincs rögzített budget esemény."));
    return;
  }
  const table = el("table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Dátum</th><th>Kategória</th><th>Típus és megjegyzés</th><th class=\"num\">Összeg</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  events.forEach((item) => {
    const row = el("tr");
    row.append(el("td", null, item.date));
    row.append(el("td", null, item.category));
    const detail = el("td");
    detail.append(el("div", null, item.type));
    if (item.note) detail.append(el("div", "note", item.note));
    row.append(detail);
    row.append(el("td", "num", money(item.amount_huf)));
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderTimeline(parent, timeline) {
  const wrapper = el("div", "timeline");
  if (!timeline.length) {
    wrapper.append(el("p", "sub", "Ebben a hónapban még nincs ismert tranzakció."));
  }
  let currentDate = "";
  timeline.forEach((item) => {
    if (item.date !== currentDate) {
      currentDate = item.date;
      wrapper.append(el("div", "day", currentDate));
    }
    const row = el("div", "tx " + item.type);
    const left = el("div");
    left.append(el("div", "merchant", item.merchant || item.description));
    left.append(el("div", "meta", item.description));
    const middle = el("div", "meta", item.category + " · " + item.type + " · " + item.account);
    row.append(left, middle, el("div", "amount", money(item.display_huf)));
    wrapper.append(row);
  });
  parent.append(wrapper);
}

let unlockedReport = null;

function monthFromUrl() {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1) : window.location.hash;
  return new URLSearchParams(hashText).get("month");
}

function monthLabel(monthKey) {
  const [year, month] = monthKey.split("-").map(Number);
  return new Intl.DateTimeFormat("hu-HU", { year: "numeric", month: "long" })
    .format(new Date(year, month - 1, 1));
}

function budapestTimestamp(isoTimestamp) {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("hu-HU", {
      timeZone: "Europe/Budapest",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).formatToParts(new Date(isoTimestamp))
      .filter((part) => part.type !== "literal")
      .map((part) => [part.type, part.value])
  );
  return parts.year + " " + parts.month + " " + parts.day
    + " - " + parts.hour + ":" + parts.minute;
}

function setUrlMonth(monthKey, replace) {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hashText);
  params.set("month", monthKey);
  const nextUrl = window.location.pathname + window.location.search + "#" + params.toString();
  window.history[replace ? "replaceState" : "pushState"]({ month: monthKey }, "", nextUrl);
}

function render(data, requestedMonth, historyAction) {
  const availableMonths = data.available_months || [data.initial_month || data.current_month];
  const monthKey = availableMonths.includes(requestedMonth)
    ? requestedMonth : (data.initial_month || data.current_month || availableMonths[0]);
  const monthData = data.months ? data.months[monthKey] : data;
  if (historyAction) setUrlMonth(monthKey, historyAction === "replace");
  const root = document.getElementById("report");
  root.textContent = "";

  const monthIndex = availableMonths.indexOf(monthKey);
  const planHeader = el("nav", "plan-header");
  planHeader.setAttribute("aria-label", "Budget hónap kiválasztása");
  const previous = el("button", "month-nav-button", "‹");
  previous.type = "button";
  previous.setAttribute("aria-label", "Előző hónap");
  previous.disabled = monthIndex === 0;
  const chooser = el("button", "month-button", monthLabel(monthKey) + " ▾");
  chooser.type = "button";
  chooser.setAttribute("aria-haspopup", "menu");
  chooser.setAttribute("aria-expanded", "false");
  chooser.setAttribute("aria-controls", "month-menu");
  const next = el("button", "month-nav-button", "›");
  next.type = "button";
  next.setAttribute("aria-label", "Következő hónap");
  next.disabled = monthIndex === availableMonths.length - 1;
  const menu = el("div", "month-menu hidden");
  menu.id = "month-menu";
  menu.setAttribute("role", "menu");
  availableMonths.forEach((key) => {
    const option = el("button", "month-option", monthLabel(key));
    option.type = "button";
    option.setAttribute("role", "menuitem");
    if (key === monthKey) option.setAttribute("aria-current", "date");
    option.addEventListener("click", () => {
      closeMonthMenu(false);
      renderMonthAndRestoreFocus(key);
    });
    menu.append(option);
  });
  const closeMonthMenu = (restoreChooserFocus = false) => {
    menu.classList.add("hidden");
    chooser.setAttribute("aria-expanded", "false");
    if (restoreChooserFocus) chooser.focus();
  };
  const renderMonthAndRestoreFocus = (key) => {
    render(data, key, "push");
    document.querySelector(".month-button").focus();
  };
  previous.addEventListener("click", () =>
    renderMonthAndRestoreFocus(availableMonths[monthIndex - 1])
  );
  next.addEventListener("click", () =>
    renderMonthAndRestoreFocus(availableMonths[monthIndex + 1])
  );
  chooser.addEventListener("click", () => {
    const opening = menu.classList.contains("hidden");
    if (opening) {
      menu.classList.remove("hidden");
      chooser.setAttribute("aria-expanded", "true");
      menu.querySelector('[aria-current="date"]').focus();
    } else {
      closeMonthMenu(true);
    }
  });
  menu.addEventListener("keydown", (event) => {
    const options = [...menu.querySelectorAll('[role="menuitem"]')];
    const index = options.indexOf(document.activeElement);
    if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      closeMonthMenu(true);
    } else if (event.key === "Tab") {
      closeMonthMenu(false);
    } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      const direction = event.key === "ArrowDown" ? 1 : -1;
      options[(index + direction + options.length) % options.length].focus();
    }
  });
  menu.addEventListener("focusout", (event) => {
    if (!menu.contains(event.relatedTarget)) closeMonthMenu(false);
  });
  planHeader.append(previous, chooser, next, menu);
  if (monthKey !== data.current_month) {
    const today = el("button", "today-button", "Today");
    today.type = "button";
    today.addEventListener("click", () => renderMonthAndRestoreFocus(data.current_month));
    planHeader.append(today);
  }
  root.append(planHeader);

  const header = el("header");
  const titleBlock = el("div");
  titleBlock.append(el("h1", null, data.title));
  const stamp = el("div", "stamp");
  stamp.append(el("div", "label", "Frissítve"));
  stamp.append(el("div", null, budapestTimestamp(data.last_enable_banking_sync_at)));
  header.append(titleBlock, stamp);
  root.append(header);

  const cashOverspending = Number(monthData.totals.cash_overspending_huf || 0);
  if (cashOverspending > 0) {
    const categoryCount = Number(monthData.totals.cash_overspent_category_count || 0);
    const announcementText = "Fedezendő cash túlköltés: " + money(cashOverspending)
      + ", " + categoryCount + " túlköltött kategória";
    const announcement = el(
      "div", "visually-hidden cash-overspending-announcement", announcementText
    );
    announcement.setAttribute("role", "alert");
    announcement.setAttribute("aria-live", "assertive");
    announcement.setAttribute("aria-label", announcementText);
    root.append(announcement);
    const overspending = el("details", "cash-overspending");
    const overspendingSummary = el("summary");
    overspendingSummary.append(el("div", "label", "Fedezendő cash túlköltés"));
    overspendingSummary.append(el("div", "value", money(cashOverspending)));
    overspendingSummary.append(el(
      "div",
      "note",
      categoryCount + " túlköltött kategória · részletek megnyitása"
    ));
    overspending.append(overspendingSummary);
    const overspendingExplanation = monthKey < data.current_month
      ? "Ez a hiány a következő hónap Ready to Assign értékében már elszámolódott."
      : "A hiányt más kategóriából történő assignmenttel kell fedezni.";
    overspending.append(el("p", "overspending-explanation", overspendingExplanation));
    const overspendingCategories = el("ul", "overspending-categories");
    overspendingCategories.setAttribute("aria-label", "Túlköltött kategóriák");
    (monthData.cash_overspent_categories || [])
      .forEach((category) => {
        const item = el("li", "overspending-category");
        item.append(el("span", null, category.name));
        item.append(el("span", "amount", money(category.overspending_huf)));
        overspendingCategories.append(item);
      });
    overspending.append(overspendingCategories);
    root.append(overspending);
  }

  const readyState = monthData.totals.unassigned_huf < 0 ? "negative"
    : monthData.totals.unassigned_huf > 0 ? "positive" : "neutral";
  const unassigned = el("details", "unassigned ready-to-assign state-" + readyState);
  const readySummary = el("summary");
  readySummary.append(el("div", "label", "Ready to Assign"));
  readySummary.append(el("div", "value", money(monthData.totals.unassigned_huf)));
  readySummary.append(el("div", "note", "Részletek megnyitása"));
  if (cashOverspending > 0) {
    const readyOverspendingNote = Number(monthData.totals.unassigned_huf || 0) === 0
      ? "Minden pénz ki van osztva; a fenti túlköltést más kategóriából kell fedezni."
      : "A fenti kategória-túlköltés a Ready to Assign értékétől külön fedezendő.";
    readySummary.append(el(
      "div",
      "note ready-overspending-note",
      readyOverspendingNote
    ));
  }
  unassigned.append(readySummary);
  const breakdown = el("div", "ready-breakdown");
  const breakdownData = monthData.ready_to_assign_breakdown || {};
  [
    ["Előző havi maradék", breakdownData.previous_month_available_huf],
    ["Havi inflow", breakdownData.monthly_inflow_huf],
    ["Előző havi cash overspending", -Number(breakdownData.previous_month_cash_overspending_huf || 0)],
    ["E havi assignment", -Number(breakdownData.assigned_this_month_huf || 0)],
    ["Jövőbe rendelve", -Number(breakdownData.assigned_in_future_huf || 0)],
    ["Hiány továbbvive későbbi hónapra", Number(breakdownData.future_deficit_deferred_huf || 0)]
  ].forEach(([label, value]) => addCard(breakdown, label, money(value)));
  unassigned.append(breakdown);
  root.append(unassigned);

  const furthestNegative = data.future_overassignment_month;
  if (furthestNegative && furthestNegative !== monthKey) {
    const warning = el("button", "alert", "Jövőbeli túlkiosztás: " + monthLabel(furthestNegative) + " · ugrás a hónapra");
    warning.type = "button";
    warning.addEventListener("click", () => render(data, furthestNegative, "push"));
    root.append(warning);
  }

  if (!data.calibration.opening_balances_loaded) {
    root.append(el("div", "alert", "Kalibráció szükséges: a 2026-08-01-i induló számlaegyenlegek még nincsenek betöltve, ezért a cash és Unassigned értékek még nem véglegesek."));
  }

  const cards = el("section", "cards summary-cards");
  addCard(cards, "Havi nettó költés", money(monthData.totals.monthly_net_spending_huf));
  addCard(cards, "Vagyon havi csökkenése", money(monthData.totals.wealth_net_release_huf));
  root.append(cards);

  renderIncome(root, monthData.income);

  const targetCards = el("section", "cards target-cards");
  targetCards.setAttribute("aria-label", "Target összesítés");
  addCard(targetCards, "E havi targetek", money(monthData.totals.monthly_target_requirement_huf));
  addCard(targetCards, "Még hozzárendelendő", money(monthData.totals.target_underfunded_huf));
  addCard(targetCards, "Célra félretéve", money(monthData.totals.target_saved_huf));
  addCard(targetCards, "Szabadon átcsoportosítható", money(monthData.totals.target_movable_huf));
  root.append(targetCards);

  root.append(el("h2", null, "Kategóriák"));
  renderCategories(root, monthData.categories, monthData.timeline, monthData.budget_events);

  root.append(el("h2", null, "Budget események"));
  renderBudgetEvents(root, monthData.budget_events);

  root.append(el("h2", null, "A hónap költései"));
  renderTimeline(root, monthData.timeline);

  const quality = el("p", "sub",
    "Minőség: review " + (data.data_quality.category_review_transactions || 0)
    + ", árfolyamhiány " + (data.data_quality.transactions_without_huf_rate || 0)
    + ", duplikált tranzakció " + (data.data_quality.duplicate_transaction_ids || 0)
  );
  root.append(quality);
}

function passwordFromUrl() {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1)
    : window.location.hash;
  const hashParams = new URLSearchParams(hashText);
  const queryParams = new URLSearchParams(window.location.search);
  const hashPassword = hashParams.get("pw") || hashParams.get("password");
  const queryPassword = queryParams.get("pw") || queryParams.get("password");
  const queryMonth = queryParams.get("month");

  if (queryPassword && !hashPassword) {
    queryParams.delete("pw");
    queryParams.delete("password");
    queryParams.delete("month");
    const nextSearch = queryParams.toString();
    hashParams.set("pw", queryPassword);
    if (queryMonth && !hashParams.get("month")) hashParams.set("month", queryMonth);
    const nextUrl = window.location.pathname
      + (nextSearch ? "?" + nextSearch : "")
      + "#" + hashParams.toString();
    window.history.replaceState(null, "", nextUrl);
    return queryPassword;
  }

  return hashPassword || queryPassword || "";
}

async function unlockWithPassword(password) {
  const error = document.getElementById("error");
  error.textContent = "";
  try {
    const data = await decryptReport(password);
    unlockedReport = data;
    render(data, monthFromUrl(), "replace");
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("report").classList.remove("hidden");
    return true;
  } catch (err) {
    error.textContent = "Nem sikerült megnyitni. Valószínűleg hibás a jelszó.";
    return false;
  }
}

document.getElementById("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  await unlockWithPassword(document.getElementById("password").value);
});

const initialPassword = passwordFromUrl();
if (initialPassword) {
  document.getElementById("password").value = initialPassword;
  unlockWithPassword(initialPassword);
}
window.addEventListener("popstate", () => {
  if (unlockedReport) render(unlockedReport, monthFromUrl(), null);
});
</script>
