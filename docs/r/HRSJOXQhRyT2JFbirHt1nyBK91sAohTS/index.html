<title>Napi YNAB riport</title>
<style>
:root {
  color-scheme: light;
  --bg: #f8faf8;
  --ink: #18201c;
  --muted: #66736b;
  --line: #d9e1dc;
  --surface: #ffffff;
  --soft: #edf3ef;
  --good: #277a4d;
  --warn: #9a6a00;
  --bad: #b83c31;
  --blue: #2f6f91;
  --accent: #5b50c6;
  --accent-soft: #efedff;
  --available: #e7f5ec;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 1220px; margin: 0 auto; padding: 20px 16px 52px; }
.lock {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.panel {
  width: min(420px, 100%);
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 22px;
}
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: 0; }
h2 { font-size: 18px; margin: 30px 0 12px; }
.sub { color: var(--muted); margin-top: 6px; }
form { display: grid; gap: 12px; margin-top: 18px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  font: inherit;
}
button {
  border: 0;
  border-radius: 6px;
  background: var(--ink);
  color: #fff;
  padding: 12px 14px;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.error { color: var(--bad); min-height: 20px; }
.hidden { display: none; }
header {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
  gap: 18px;
  align-items: center;
  padding-bottom: 16px;
}
.stamp { color: var(--muted); text-align: right; }
.month-nav { display: flex; align-items: center; justify-content: center; gap: 8px; }
.month-nav button {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 20px;
}
.month-nav button:disabled { opacity: .35; cursor: default; }
.month-nav select {
  min-width: 172px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 9px 34px 9px 12px;
  font: inherit;
  font-weight: 700;
  text-align: center;
}
.plan-banner {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  border-radius: 10px;
  padding: 14px 16px;
  background: var(--accent-soft);
  border: 1px solid #d8d3ff;
}
.plan-banner strong { color: #4338a8; }
.plan-banner.bad { background: #fff0ee; border-color: #f1c0ba; }
.plan-banner.bad strong { color: var(--bad); }
.plan-banner.warn { background: #fff7df; border-color: #ead79c; }
.plan-banner.warn strong { color: var(--warn); }
.read-only {
  display: inline-block;
  margin-top: 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 8px;
  color: var(--muted);
  font-size: 12px;
}
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plan-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  background: var(--surface);
  border: 1px solid #d8d3ff;
  border-left: 5px solid var(--accent);
  border-radius: 10px;
  padding: 14px 16px;
}
.plan-amount { color: #4338a8; font-size: 20px; font-weight: 750; white-space: nowrap; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 18px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 1px 2px rgba(24, 32, 28, .03);
}
.label { color: var(--muted); font-size: 12px; }
.value { font-size: 22px; font-weight: 650; margin-top: 4px; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 12px; font-weight: 650; background: var(--soft); }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fbfcfb; }
.available { font-size: 15px; font-weight: 750; }
.available.good { color: var(--good); }
.available.warn { color: var(--warn); }
.available.bad { color: var(--bad); }
.progress { height: 5px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 7px; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.progress.bad > span { background: var(--bad); }
.responsive-table { overflow-x: auto; border-radius: 10px; }
.responsive-table:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.scroll-hint { display: none; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
details.timeline-details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
details.timeline-details > summary { cursor: pointer; padding: 13px 15px; font-weight: 650; }
details.timeline-details .timeline { padding: 0 12px 12px; }
.empty {
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--muted);
  padding: 24px;
  text-align: center;
}
.status {
  display: inline-block;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
  background: var(--soft);
}
.ok, .rendezve, .félretéve { color: var(--good); }
.szoros { color: var(--warn); }
.túlköltve { color: var(--bad); }
.note { color: var(--muted); font-size: 12px; margin-top: 3px; }
.timeline { display: grid; gap: 8px; }
.day { margin-top: 16px; color: var(--muted); font-weight: 650; }
.tx {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) 130px;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
.merchant { font-weight: 650; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.refund .amount { color: var(--good); }
.projekt .amount { color: var(--warn); }
.átvezetés .amount { color: var(--blue); }
@media (max-width: 820px) {
  header { grid-template-columns: 1fr; text-align: center; }
  .stamp { text-align: left; margin-top: 8px; }
  .stamp { text-align: center; }
  .cards { grid-template-columns: 1fr 1fr; }
  .plans { grid-template-columns: 1fr; }
  .scroll-hint { display: block; }
  .tx { grid-template-columns: 1fr; gap: 5px; }
  .amount { text-align: left; }
}
@media (max-width: 640px) {
  .envelope-table {
    display: block;
    width: 100%;
    overflow: hidden;
    border-collapse: separate;
    border-spacing: 0;
  }
  .envelope-table thead { display: none; }
  .envelope-table tbody { display: block; width: 100%; }
  .envelope-table tbody tr {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
    border-bottom: 1px solid var(--line);
  }
  .envelope-table tbody tr:last-child { border-bottom: 0; }
  .envelope-table td { border-bottom: 0; }
  .envelope-table .envelope-name {
    grid-column: 1 / -1;
    padding: 14px 14px 10px;
    font-weight: 650;
  }
  .envelope-table .envelope-name .note { font-weight: 400; }
  .envelope-table .progress {
    width: 100%;
    height: 6px;
    margin-top: 10px;
  }
  .envelope-table .envelope-metric {
    min-width: 0;
    padding: 0 8px 14px;
    text-align: center;
    font-size: 14px;
  }
  .envelope-table .envelope-metric::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  .envelope-table .available { font-size: 14px; }
}
@media (max-width: 360px) {
  main { padding-left: 12px; padding-right: 12px; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .plan-banner { align-items: flex-start; flex-direction: column; }
}
</style>
</head>

const money = (value) => {
  const rounded = Math.round(Number(value || 0));
  return new Intl.NumberFormat("hu-HU").format(rounded) + " Ft";
};

const timestamp = (value) => value
  ? new Intl.DateTimeFormat("hu-HU", {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    }).format(new Date(value))
  : "nincs adat";

const bytes = (base64) => Uint8Array.from(atob(base64), (char) => char.charCodeAt(0));

async function decryptReport(password) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: bytes(encryptedReport.salt),
      iterations: encryptedReport.iterations,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  const plaintext = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(encryptedReport.nonce) },
    key,
    bytes(encryptedReport.ciphertext)
  );
  return JSON.parse(new TextDecoder().decode(plaintext));
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function addCard(parent, label, value, note) {
  const card = el("div", "card");
  card.append(el("div", "label", label), el("div", "value", value));
  if (note) card.append(el("div", "note", note));
  parent.append(card);
}

function renderPlans(parent, plans) {
  if (!plans || !plans.length) return;
  parent.append(el("h2", null, "Ismert havi tervek"));
  const grid = el("section", "plans");
  plans.forEach((item) => {
    const card = el("div", "plan-card");
    const copy = el("div");
    copy.append(el("div", "merchant", item.name));
    copy.append(el("div", "note", item.status + " · " + item.note));
    card.append(copy, el("div", "plan-amount", money(item.target_huf)));
    grid.append(card);
  });
  parent.append(grid);
}

function renderFundingEvents(parent, events) {
  if (!events || !events.length) return;
  parent.append(el("h2", null, "Havi windfall-keret eseményei"));
  const grid = el("section", "plans");
  events.forEach((item) => {
    const card = el("div", "plan-card");
    const copy = el("div");
    const status = item.status === "applied" ? "alkalmazott" : "tervezett";
    copy.append(el("div", "merchant", item.date + " · " + status));
    copy.append(el("div", "note", item.note));
    card.append(copy, el("div", "plan-amount", money(item.amount_huf)));
    grid.append(card);
  });
  parent.append(grid);
}

function renderEnvelopes(parent, envelopes) {
  const table = el("table", "envelope-table");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Zseb</th><th class=\"num\">Nyitó elérhető</th><th class=\"num\">Kiosztva</th><th class=\"num\">Tervezett kiosztás</th><th class=\"num\">Aktivitás</th><th class=\"num\">Elérhető</th></tr>";
  table.append(thead);
  const tbody = el("tbody");
  envelopes.forEach((item) => {
    const row = el("tr");
    const name = el("td", "envelope-name");
    name.append(el("div", null, item.name));
    if (item.is_protected) name.append(el("div", "note", "védett céltartalék"));
    if (item.monthly_target_huf) name.append(el("div", "note", "havi cél: " + money(item.monthly_target_huf)));
    const spendable = Math.max(1, Number(item.opening_huf || 0) + Number(item.assigned_huf || 0));
    const progress = el("div", "progress" + (item.overspent_huf > 0 ? " bad" : ""));
    progress.setAttribute("role", "progressbar");
    progress.setAttribute("aria-label", item.overspent_huf > 0
      ? item.name + " túlköltve " + money(item.overspent_huf)
      : item.name + " felhasználása");
    progress.setAttribute("aria-valuemin", "0");
    const progressNow = Math.max(0, Number(item.activity_huf || 0));
    progress.setAttribute("aria-valuemax", String(Math.round(Math.max(spendable, progressNow))));
    progress.setAttribute("aria-valuenow", String(Math.round(progressNow)));
    const progressFill = el("span");
    progressFill.style.width = Math.min(100, Math.max(0, Number(item.activity_huf || 0) / spendable * 100)) + "%";
    progress.append(progressFill);
    name.append(progress);
    row.append(name);
    const opening = el("td", "num envelope-metric", money(item.opening_huf));
    opening.dataset.label = "Nyitó";
    row.append(opening);
    const assigned = el("td", "num envelope-metric", money(item.assigned_huf));
    assigned.dataset.label = "Kiosztva";
    row.append(assigned);
    const plannedAssigned = el("td", "num envelope-metric", money(item.planned_assigned_huf));
    plannedAssigned.dataset.label = "Tervezett";
    row.append(plannedAssigned);
    const activity = el("td", "num envelope-metric", money(item.activity_huf));
    activity.dataset.label = "Aktivitás";
    row.append(activity);
    const availableClass = item.available_huf < -0.5 ? "bad" : item.available_huf <= Math.max(spendable * .15, 1) ? "warn" : "good";
    const available = el("td", "num envelope-metric available " + availableClass, money(item.available_huf));
    available.dataset.label = "Elérhető";
    row.append(available);
    tbody.append(row);
  });
  table.append(tbody);
  parent.append(table);
}

function renderTimeline(parent, timeline) {
  if (!timeline.length) {
    parent.append(el("div", "empty", "Ebben a hónapban még nincs banki aktivitás vagy alkalmazott kiosztás. A tervezett összegek nem elkölthető pénzek."));
    return;
  }
  const details = el("details", "timeline-details");
  details.append(el("summary", null, timeline.length + " tranzakció megjelenítése"));
  const wrapper = el("div", "timeline");
  let currentDate = "";
  timeline.forEach((item) => {
    if (item.date !== currentDate) {
      currentDate = item.date;
      wrapper.append(el("div", "day", currentDate));
    }
    const row = el("div", "tx " + item.type);
    const left = el("div");
    left.append(el("div", "merchant", item.merchant || item.description));
    left.append(el("div", "meta", item.description));
    const nativeAmount = new Intl.NumberFormat("hu-HU", { maximumFractionDigits: 2 }).format(Math.abs(item.amount)) + " " + item.currency;
    const middle = el("div", "meta", item.category + " · " + item.type + " · " + item.account + " · " + nativeAmount);
    const amountText = money(item.display_huf);
    row.append(left, middle, el("div", "amount", amountText));
    wrapper.append(row);
  });
  details.append(wrapper);
  parent.append(details);
}

const monthLabel = (monthStart) => new Intl.DateTimeFormat("hu-HU", {
  year: "numeric",
  month: "long"
}).format(new Date(monthStart + "T12:00:00"));

function selectedMonthFromUrl(data) {
  const requested = new URLSearchParams(window.location.search).get("month");
  if (requested) {
    const normalized = requested.length === 7 ? requested + "-01" : requested;
    if ((data.available_months || []).includes(normalized)) return normalized;
  }
  return data.default_month || data.month_start;
}

function updateMonthUrl(monthKey) {
  const params = new URLSearchParams(window.location.search);
  params.set("month", monthKey.slice(0, 7));
  window.history.replaceState(null, "", window.location.pathname + "?" + params.toString() + window.location.hash);
}

  const previous = el("button", null, "‹");
  previous.type = "button";
  previous.setAttribute("aria-label", "Előző hónap");
  const selector = el("select");
  selector.id = "month-selector";
  selector.setAttribute("aria-label", "Költségvetési hónap");
  const availableMonths = reportData.available_months || [data.month_start];
  availableMonths.forEach((availableMonth) => {
    const option = el("option", null, monthLabel(availableMonth));
    option.value = availableMonth;
    option.selected = availableMonth === monthKey;
    selector.append(option);
  });
  const next = el("button", null, "›");
  next.type = "button";
  next.setAttribute("aria-label", "Következő hónap");
  const monthIndex = availableMonths.indexOf(monthKey);
  previous.disabled = monthIndex <= 0;
  next.disabled = monthIndex >= availableMonths.length - 1;
  const selectMonth = (newMonth) => {
    updateMonthUrl(newMonth);
    const nextData = reportData.months ? reportData.months[newMonth] : reportData;
    render(nextData, reportData, newMonth);
    document.getElementById("report-heading").focus();
  };
  previous.addEventListener("click", () => selectMonth(availableMonths[monthIndex - 1]));
  next.addEventListener("click", () => selectMonth(availableMonths[monthIndex + 1]));
  selector.addEventListener("change", () => selectMonth(selector.value));
  monthNav.append(previous, selector, next);
  const stamp = el("div", "stamp");
  stamp.append(el("div", "label", "Banki adat · riport"));
  stamp.append(el("div", null,
    timestamp(data.cash_identity.latest_fetched_at) + " · " + timestamp(data.generated_at)));
  header.append(titleBlock, monthNav, stamp);
  root.append(header);

  const currentMonth = data.current_month;
  const isFuture = monthKey > currentMonth;
  const isPast = monthKey < currentMonth;
  const isOverspent = Number(data.totals.overspent_huf || 0) > .5;
  const isRtaNegative = Number(data.totals.ready_to_assign_huf || 0) < -.5;
  const hasReadyToAssign = Number(data.totals.ready_to_assign_huf || 0) > .5;
  const banner = el("section", "plan-banner"
    + (isOverspent || isRtaNegative ? " bad" : hasReadyToAssign ? " warn" : ""));
  const bannerText = el("div");
  const periodLabel = isFuture ? "Jövő hónap terve" : isPast ? "Lezárt havi nézet" : "Aktuális havi terv";
  const alertLabel = isRtaNegative
    ? "Negatív kiosztásra váró összeg rendezendő: " + money(data.totals.ready_to_assign_huf)
    : isOverspent
    ? "Túlköltés rendezendő: " + money(data.totals.overspent_huf)
    : hasReadyToAssign
      ? "Kiosztásra vár: " + money(data.totals.ready_to_assign_huf)
      : periodLabel;
  bannerText.append(el("strong", null, alertLabel));
  bannerText.append(el("div", "note",
    "Nyitó elérhető + kiosztva − aktivitás = elérhető."
    + (isFuture ? " A tervezett finanszírozás és kiosztás még nem elkölthető pénz." : "")
    + (isRtaNegative ? " Ez valós, beavatkozást igénylő tervállapot; a riport ettől még elérhető." : "")
    + (isOverspent ? " A negatív zsebeket a következő finanszírozási döntés előtt rendezni kell." : "")));
  const availableClass = isOverspent || isRtaNegative ? "available bad" : "available good";
  banner.append(bannerText, el("div", availableClass,
    money(data.totals.available_huf) + " zsebekben elérhető"));
  root.append(banner);

  renderPlans(root, data.plans || []);

  root.append(el("h2", null, "Kiosztásra váró összeg egyeztetése"));
  const cards = el("section", "cards");
  addCard(cards, "Nyitó kiosztásra vár", money(data.totals.opening_ready_to_assign_huf));
  addCard(cards, "Alap havi átutalási terv", money(data.totals.planned_monthly_funding_huf),
    "módosítható input, nem költési plafon");
  addCard(cards, "Tervbe engedett windfall-keret", money(data.totals.funding_received_huf),
    "jóváhagyott virtuális finanszírozás; nem állítja, hogy banki átutalás történt");
  const fundingDifference = Number(data.totals.difference_from_default_funding_huf || 0);
  addCard(cards, "Alkalmazott eltérés a 2M alaptól", money(fundingDifference),
    fundingDifference > .5 ? "az alapnál több jóváhagyott havi keret"
      : fundingDifference < -.5 ? "az alapnál kevesebb jóváhagyott havi keret"
      : "megegyezik a módosítható havi alappal");
  if (Number(data.totals.funding_planned_huf || 0) > .5) {
    const plannedDifference = Number(
      data.totals.planned_difference_from_default_funding_huf || 0
    );
    addCard(cards, "Tervezett eltérés a 2M alaptól", money(plannedDifference),
      "csak proposal; jóváhagyásig nem elkölthető");
  }
  addCard(cards, "Külső banki bevétel", money(data.totals.external_inflows_huf),
    "teljesült income és cashback aktív tervszámlákon");
  addCard(cards, "Előző havi cash túlköltés", money(data.totals.cash_overspending_rollover_huf),
    "a nyitó kiosztásra váró összeget csökkenti");
  addCard(cards, "Alkalmazott kiosztás", money(data.totals.total_applied_allocations_huf),
    "zsebek és külön projektek jóváhagyott allokációja");
  addCard(cards, "Záró kiosztásra vár", money(data.totals.ready_to_assign_huf),
    "nyitó + finanszírozás + külső bevétel − kiosztás");
  addCard(cards, "Tervezett finanszírozás", money(data.totals.funding_planned_huf),
    "jóváhagyásig nem elkölthető");
  addCard(cards, "Tervezett kiosztás", money(data.totals.total_planned_allocations_huf),
    "jóváhagyásig nem módosítja a zsebeket");
  addCard(cards, "Aktivitás", money(data.totals.operating_activity_huf), "banki költés mínusz refund");
  addCard(cards, "Rugalmasan elérhető", money(data.totals.flexible_available_huf));
  addCard(cards, "Védett céltartalék", money(data.totals.protected_available_huf));
  addCard(cards, "Túlköltés", money(data.totals.overspent_huf),
    data.totals.overspent_huf > 0
      ? "ha hónapzárásig nincs rendezve, a következő havi kiosztásra váró összeget csökkenti"
      : "nincs rendezetlen negatív zseb");
  const ageValue = !data.age_of_money.applies_to_selected_month || data.age_of_money.days == null
    ? "—"
    : data.age_of_money.days + " nap";
  const ageNote = !data.age_of_money.applies_to_selected_month
    ? "csak az aktuális, " + data.age_of_money.as_of_date + " napi virtuális tervsnapshoton értelmezett"
    : data.age_of_money.status === "insufficient_outflows"
      ? "legalább tíz cash outflow után számítható"
    : data.age_of_money.status === "provisional_pending"
      ? "előzetes: " + data.age_of_money.pending_outflow_count + " függő tétel van az utolsó tízben"
      : "utolsó " + data.age_of_money.sample_count + " cash outflow átlaga · virtuális cutover/funding lotok";
  addCard(cards, "Virtuális terv pénzének kora", ageValue, ageNote);
  addCard(cards, "Legutóbbi banki likvid pénz", money(data.cash_identity.provider_liquid_cash_huf),
    "összes aktív backing UID összege a közös refresh batchből");
  addCard(cards, "Virtuális terv mögötti pénz", money(data.cash_identity.virtual_plan_cash_huf),
    data.cash_identity.is_cash_backed
      ? "fedezett; a hozzá nem rendelt összeg számított maradék, az account reconciliation külön gate"
      : "FIGYELEM: a virtuális terv nincs teljesen fedezve");
  addCard(cards, "Tervhez még nem rendelt likvid pénz", money(data.cash_identity.unallocated_liquid_cash_huf),
    "tartalmazhat windfallt, üzleti, adó- és projektre elkülönített banki pénzt is");
  addCard(cards, "Külön projektek havi", money(data.totals.project_month_activity_huf));
  root.append(cards);

  renderFundingEvents(root, data.funding_events || []);

  root.append(el("h2", null, "Zsebek"));
  renderEnvelopes(root, data.envelopes);

  root.append(el("h2", null, "Külön finanszírozott projektek"));
  renderProjects(root, data.projects);

  root.append(el("h2", null, "Éves és ritka kiadások"));
  renderTrueExpenses(root, data.true_expenses);

  root.append(el("h2", null, "Havi kiadások időrendben"));
  renderTimeline(root, data.timeline);

  const quality = el("p", "sub",
    "Minőség: review " + (data.data_quality.category_review_transactions || 0)
    + ", árfolyamhiány " + (data.data_quality.transactions_without_huf_rate || 0)
    + ", duplikált tranzakció " + (data.data_quality.duplicate_transaction_ids || 0)
    + ", frissítési hiba " + (data.data_quality.latest_refresh_readiness_failures || 0)
    + ", pénzfedezeti hiba " + (data.data_quality.cash_backing_failures || 0)
    + ", negatív RTA-hónap " + (data.data_quality.negative_ready_to_assign_months || 0)
    + ", pénzkor-párosítási hiba " + (data.data_quality.age_of_money_unmatched_outflows || 0)
    + ", pénzkor-egyenlegeltérés " + (data.data_quality.age_of_money_cash_identity_failures || 0)
  );
  root.append(quality);
}

function passwordFromUrl() {
  const hashText = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1)
    : window.location.hash;
  const hashParams = new URLSearchParams(hashText);
  const hashPassword = hashParams.get("pw") || hashParams.get("password");
  return hashPassword || "";
}

async function unlockWithPassword(password) {
  const error = document.getElementById("error");
  error.textContent = "";
  try {
    const data = await decryptReport(password);
    const selectedMonth = selectedMonthFromUrl(data);
    const selectedData = data.months ? data.months[selectedMonth] : data;
    render(selectedData, data, selectedMonth);
    document.getElementById("lock").classList.add("hidden");
    document.getElementById("report").classList.remove("hidden");
    document.getElementById("report-heading").focus();
    return true;
  } catch (err) {
    error.textContent = "Nem sikerült megnyitni. Valószínűleg hibás a jelszó.";
    return false;
  }
}

document.getElementById("unlock").addEventListener("submit", async (event) => {
  event.preventDefault();
  await unlockWithPassword(document.getElementById("password").value);
});

const initialPassword = passwordFromUrl();
if (initialPassword) {
  document.getElementById("password").value = initialPassword;
  unlockWithPassword(initialPassword);
}
</script>
